[project]
name = "asciiatc"
version = "0.1.0"
description = "Terminal-based live radar display for aircraft"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.89.0",
    "httpx>=0.27.0",
]

[project.scripts]
asciiatc = "asciiatc.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asciiatc"]
